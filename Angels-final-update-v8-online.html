<style>
  :root{
    --navy:#1F6B4A;
    --navy-dk:#12432D;
    --navy-lt:#2E8A61;
    --gold:#C8B35A;
    --gold-lt:#EFE6A8;
    --cream:#F6F2E9;
    --paper:#FFFDF9;
    --ink:#22283A;
    --slate:#5C6478;
    --line:#E4DCC9;
    --green:#2F7B4F;
    --green-bg:#E7F3EB;
    --red:#B4432E;
    --red-bg:#FBEAE6;
    --amber:#9C6B12;
    --amber-bg:#FBF1DC;
    --radius:10px;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;}
  body{
    font-family:var(--sans);
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none !important;}

  #splashScreen{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(circle at 20% 15%, rgba(200,179,90,0.14), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(200,179,90,0.12), transparent 45%),
      var(--navy-dk);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;padding:20px;
    transition:opacity .6s ease;
    animation:splashAutoHide 10s forwards;
  }
  @keyframes splashAutoHide{
    0%,96%{opacity:1;visibility:visible;pointer-events:auto;}
    100%{opacity:0;visibility:hidden;pointer-events:none;}
  }
  #splashScreen .crest{width:130px;height:130px;margin-bottom:18px;box-shadow:none;}
  #splashScreen h1{font-family:var(--serif);font-size:20px;margin:0 0 4px;letter-spacing:0.3px;}
  #splashScreen p.splash-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-lt);margin:0 0 26px;}
  #splashScreen .splash-loading{font-size:13px;color:#cfd6e6;letter-spacing:1px;animation:splashPulse 1.4s ease-in-out infinite;}
  @keyframes splashPulse{
    0%,100%{opacity:0.55;} 50%{opacity:1;}
  }
  #splashScreen .splash-credit{
    position:absolute;bottom:26px;left:0;right:0;
    font-size:10.5px;color:#8b96b0;letter-spacing:0.4px;
  }

  }
  .crest.lg{width:96px;height:96px;}

  #loginScreen{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(200,179,90,0.12), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(200,179,90,0.10), transparent 45%),
      var(--navy-dk);
    padding:20px;
  }
  .login-card{
    width:100%;max-width:400px;
    background:var(--paper);
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .login-top{
    background:var(--navy);
    padding:32px 28px 24px;
    text-align:center;
    color:#fff;
  }
  .login-top .school-name{
    font-family:var(--serif);
    font-size:20px;
    margin:12px 0 2px;
    letter-spacing:0.3px;
  }
  .login-top .school-sub{
    font-size:11.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-lt);
    margin:0;
  }
  .login-body{padding:26px 28px 30px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:12.5px;font-weight:600;
    color:var(--slate);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .field input, .field select{
    width:100%;padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:14.5px;
    font-family:var(--sans);
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(200,179,90,0.15);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 18px;border-radius:8px;border:none;
    font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--sans);
    transition:transform .05s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-lt);}
  .btn-gold{background:var(--gold);color:var(--navy-dk);}
  .btn-gold:hover{background:var(--gold-lt);}
  .btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid #f0c6bb;}
  .btn-danger:hover{background:var(--red);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:6px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .msg-box{
    padding:10px 12px;border-radius:8px;font-size:13.5px;
    margin-bottom:14px;font-weight:500;display:flex;gap:8px;align-items:flex-start;
  }
  .msg-error{background:var(--red-bg);color:var(--red);border:1px solid #f0c6bb;}
  .msg-success{background:var(--green-bg);color:var(--green);border:1px solid #c3e2cd;}
  .msg-warn{background:var(--amber-bg);color:var(--amber);border:1px solid #ecd9a8;}

  .role-toggle{
    display:flex;gap:8px;margin-bottom:18px;
    background:var(--cream);padding:4px;border-radius:9px;
  }
  .role-toggle button{
    flex:1;padding:9px 6px;border:none;background:transparent;
    border-radius:7px;font-size:13px;font-weight:600;color:var(--slate);
    cursor:pointer;font-family:var(--sans);
  }
  .role-toggle button.active{
    background:var(--navy);color:#fff;
  }

  .login-foot{
    text-align:center;font-size:11.5px;color:var(--slate);
    padding:14px 20px 22px;
  }

  #appScreen{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 22px;flex-wrap:wrap;gap:10px;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-title{font-family:var(--serif);font-size:17px;line-height:1.15;}
  .topbar-title small{
    display:block;font-family:var(--sans);font-size:10.5px;
    color:var(--gold-lt);letter-spacing:1.5px;text-transform:uppercase;
    margin-top:2px;
  }
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;}
  .role-pill{
    padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
    letter-spacing:0.5px;text-transform:uppercase;
  }
  .role-pill.bursar{background:var(--gold);color:var(--navy-dk);}
  .role-pill.director{background:#3E5A94;color:#fff;}

  .sync-pill{
    padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;
    letter-spacing:0.2px;white-space:nowrap;
  }
  .sync-pill.sync-connecting{background:#3E5A94;color:#fff;}
  .sync-pill.sync-syncing{background:var(--amber-bg);color:var(--amber);}
  .sync-pill.sync-synced{background:var(--green-bg);color:var(--green);}
  .sync-pill.sync-offline{background:var(--red-bg);color:var(--red);}
  .sync-pill.sync-error{background:var(--red-bg);color:var(--red);}
  .login-sync-note{text-align:center;font-size:11px;margin-top:10px;}

  .navtabs{
    background:var(--navy-lt);
    display:flex;gap:2px;padding:0 16px;overflow-x:auto;
  }
  .navtabs button{
    background:transparent;border:none;color:#d8dfec;
    padding:12px 16px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:var(--sans);white-space:nowrap;
    border-bottom:3px solid transparent;
  }
  .navtabs button:hover{color:#fff;}
  .navtabs button.active{
    color:#fff;border-bottom-color:var(--gold);
  }

  main{flex:1;padding:26px 3vw 60px;max-width:100%;margin:0 auto;width:100%;}

  /* Large screens / TVs: scale content up so wide-screen mirroring doesn't leave things looking small or letterboxed */
  @media(min-width:1600px){
    main{padding:36px 4vw 70px;}
    body{font-size:18px;}
    .page-head h1{font-size:28px;}
  }
  @media(min-width:2200px){
    body{font-size:22px;}
    .page-head h1{font-size:34px;}
  }

  .view{animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .page-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:20px;flex-wrap:wrap;gap:10px;
  }
  .page-head h1{
    font-family:var(--serif);font-size:23px;margin:0 0 4px;color:var(--navy-dk);
  }
  .page-head p{margin:0;color:var(--slate);font-size:13.5px;}

  .card{
    background:var(--paper);border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(21,42,78,0.05);
    padding:22px;margin-bottom:18px;
  }
  .card h2{
    font-family:var(--serif);font-size:17px;margin:0 0 16px;color:var(--navy-dk);
    padding-bottom:10px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  @media(max-width:800px){.stats-row{grid-template-columns:repeat(2,1fr);}}
  .stat{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);

<script>
/* =========================================================================
   ANGELS INFANT AND JUNIOR SCHOOL — FEES MANAGEMENT SYSTEM 
   Single-file application. localStorage is the only source of truth for
   every read/write in the app below.

   DATA MODEL (v2):
   Student = {
     id, name, grade, phone, address,
     openingBalance,             // set once at creation — balance owed before this system began tracking
     termCharges: [              // one entry per term's fees — NEVER overwritten, always appended
       { id, year, term, amount, addedAt, addedBy, note }
     ],
     payments: [                 // full payment history
       { id, amount, date, year, term, recordedAt, recordedBy, balanceAfter }
     ],
     isArchived, archivedAt, archivedBy,
     createdAt, createdBy
   }
   totalOwed   = openingBalance + sum(termCharges.amount)
   totalPaid   = sum(payments.amount)
   outstanding = totalOwed - totalPaid
   ========================================================================= */

const LS_USERS = 'aijs_users';
const LS_STUDENTS = 'aijs_students';
const LS_SETTINGS = 'aijs_settings';
const LS_AUDIT = 'aijs_audit';
const LS_RECEIPT_COUNTER = 'aijs_receipt_counter';
const LS_VACATION = 'aijs_vacation_v1';
const LS_VACATION_RECEIPT_COUNTER = 'aijs_vacation_receipt_counter';
const GRADES = ['ECD A','ECD B','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7'];
const TERMS = [1,2,3];
const YEARS = [2025,2026,2027,2028,2029,2030,2031,2032,2033,2034,2035,2036,2037,2038,2039,2040];

/* ---------------------- Security helpers ---------------------- */
const _pr=[];for(let n=2;_pr.length<64;n++){if(_pr.every(p=>n%p))_pr.push(n);}
const SHA_K=_pr.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296));
const SHA_H=_pr.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296));
function sha256(s){
  const m=Array.from(new TextEncoder().encode(s)),L=m.length*8;
  m.push(0x80);while(m.length%64!==56)m.push(0);
  const hi=Math.floor(L/4294967296),lo=L>>>0;
  m.push(hi>>>24&255,hi>>>16&255,hi>>>8&255,hi&255,lo>>>24&255,lo>>>16&255,lo>>>8&255,lo&255);
  let h=SHA_H.slice();const w=new Array(64);
  for(let i=0;i<m.length;i+=64){
    for(let t=0;t<16;t++)w[t]=(m[i+4*t]<<24)|(m[i+4*t+1]<<16)|(m[i+4*t+2]<<8)|m[i+4*t+3];
    for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      const s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;}
    let [a,b,c,d,e,f,g,k]=h;
    for(let t=0;t<64;t++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const t1=(k+S1+((e&f)^(~e&g))+SHA_K[t]+w[t])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const t2=(S0+((a&b)^(a&c)^(b&c)))|0;
      k=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    const v=[a,b,c,d,e,f,g,k];h=h.map((x,j)=>(x+v[j])|0);
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function newSalt(){try{const u=new Uint8Array(16);crypto.getRandomValues(u);return Array.from(u).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);}}
function hashPw(pw,salt){let x=salt+':'+pw;for(let i=0;i<3000;i++)x=sha256(x+salt);return x;}
function setPw(u,pw){u.salt=newSalt();u.hash=hashPw(pw,u.salt);delete u.password;}
function verifyPw(u,pw){return !!(u&&u.hash&&u.hash===hashPw(pw,u.salt));}
function setPin(u,pin){u.pinSalt=newSalt();u.pinHash=hashPw(pin,u.pinSalt);delete u.recoveryPin;}
function verifyPin(u,pin){return !!(u&&u.pinHash&&u.pinHash===hashPw(pin,u.pinSalt));}

/* Lockout: 5 wrong tries locks that account for 5 minutes */
const LS_LOCK='aijs_lock';
function _lockMap(){try{return JSON.parse(storage.getItem(LS_LOCK)||'{}');}catch(e){return {};}}
function lockRemaining(key){const e=_lockMap()[key];return e&&e.until>Date.now()?Math.ceil((e.until-Date.now())/60000):0;}
function registerFail(key){const m=_lockMap();const e=m[key]||{n:0,until:0};if(e.until&&e.until<=Date.now()){e.n=0;e.until=0;}e.n++;
  if(e.n>=5){e.until=Date.now()+300000;e.n=0;logAudit({type:'edit',studentId:'',studentName:key,summary:'Too many wrong attempts — account locked for 5 minutes'});}
  m[key]=e;storage.setItem(LS_LOCK,JSON.stringify(m));return e.until>Date.now();}
function clearFails(key){const m=_lockMap();delete m[key];storage.setItem(LS_LOCK,JSON.stringify(m));}
function requireBursar(evt){
  if(currentUser&&currentUser.role==='Bursar')return true;
  if(evt&&evt.preventDefault)evt.preventDefault();
  toast('Only the Bursar can do this.','error');return false;}

/* ---------------------- Safe Storage Wrapper ----------------------
   Some app-builder WebView wrappers (used to turn this HTML file into an
   APK) ship with DOM Storage disabled by default. If real localStorage is
   blocked or throws, everything below falls back to an in-memory store so
   the app still runs instead of breaking silently — the only difference is
   that data won't survive closing the app until DOM Storage is enabled in
   the app wrapper's settings. A banner warns the user when this happens. */
let usingFallbackStorage = false;
const memoryStore = {};
const storage = {
  getItem(key){
    try{ return window.localStorage.getItem(key); }
    catch(e){ usingFallbackStorage = true; return (key in memoryStore) ? memoryStore[key] : null; }
  },
  setItem(key, value){
    try{ window.localStorage.setItem(key, value); }
    catch(e){ usingFallbackStorage = true; memoryStore[key] = value; }
  },
  removeItem(key){
    try{ window.localStorage.removeItem(key); }
    catch(e){ usingFallbackStorage = true; delete memoryStore[key]; }
  }
};

let currentUser = null;
let selectedLoginRole = 'ADMIN';
let studentSearchTerm = '';
let studentGradeFilter = '';
let showArchived = false;
let paymentsSearchTerm = '';
let paymentsYearFilter = '';
let paymentsTermFilter = '';
let paymentsPrintFilter = '';
let activeTab = 'dashboard';

/* ---------------------- Storage helpers ---------------------- */
function loadUsers(){
  let u = JSON.parse(storage.getItem(LS_USERS) || 'null');
  let changed = false;
  if(!u){
    u = { ADMIN:{ role:'Bursar', displayName:'Bursar', mustChange:true }, PRINCIPAL:{ role:'Director', displayName:'Director', mustChange:true } };
    setPw(u.ADMIN,'1234'); setPw(u.PRINCIPAL,'1234'); changed = true;
  }
  if(!u.HEADMASTER){ u.HEADMASTER = { role:'Headmaster', displayName:'Headmaster', mustChange:true }; setPw(u.HEADMASTER,'1234'); changed = true; }
  Object.keys(u).forEach(function(k){
    const x = u[k];
    if(x.password !== undefined && !x.hash){ if(x.password === '1234') x.mustChange = true; setPw(x, String(x.password)); changed = true; }
    if(x.recoveryPin && !x.pinHash){ setPin(x, String(x.recoveryPin)); changed = true; }
  });
  if(changed) storage.setItem(LS_USERS, JSON.stringify(u));
  return u;
}
function saveUsers(u){ storage.setItem(LS_USERS, JSON.stringify(u)); }

function loadStudentsRaw(){
  return JSON.parse(storage.getItem(LS_STUDENTS) || '[]');
}
function saveStudents(list){ storage.setItem(LS_STUDENTS, JSON.stringify(list)); }

/* Migrates any student saved under the old (v1) data shape into the v2 shape.
   Old shape had: prevBalance, currentFees, year, term directly on the student. */
function migrateStudent(s){
  if(s.termCharges) return s; // already v2
  const legacyYear = s.year || currentAcademicYear();
  const legacyTerm = s.term || 1;
  s.openingBalance = Number(s.prevBalance || 0);
  s.termCharges = [{
    id: uid('chg'),
    year: legacyYear,
    term: legacyTerm,
    amount: Number(s.currentFees || 0),
    addedAt: s.createdAt || new Date().toISOString(),
    addedBy: 'system-migration',
    note: 'Migrated from previous system version'
  }];
  delete s.prevBalance;
  delete s.currentFees;
  delete s.year;
  delete s.term;
  s.isArchived = !!s.isArchived;
  return s;
}

function loadStudents(){
  const list = loadStudentsRaw().map(migrateStudent);
  const backfilled = backfillReceiptNumbers(list);
  saveStudents(list); // persist migration/backfill so it only ever runs once
  return list;
}

/* ---------------------- August Grade 7 Vacation Fees (standalone) ----------------------
   This is a deliberately separate register from the regular term fee ledger above —
   it does not touch student.termCharges or student.payments, and its receipts never
   show ordinary term balances. It only ever concerns August Grade 7 vacation lessons. */
function loadVacationPayments(){
  return JSON.parse(storage.getItem(LS_VACATION) || '[]');
}
function saveVacationPayments(list){ storage.setItem(LS_VACATION, JSON.stringify(list)); }
function nextVacationReceiptNumber(){
  let n = parseInt(storage.getItem(LS_VACATION_RECEIPT_COUNTER) || '1000', 10);
  n = n + 1;
  storage.setItem(LS_VACATION_RECEIPT_COUNTER, String(n));
  return 'AIJS-VAC-' + String(n).padStart(6,'0');
}

function loadSettings(){
  let s = JSON.parse(storage.getItem(LS_SETTINGS) || 'null');
  if(!s){
    s = { receiptFooter: 'Thank you for your prompt payment. This receipt is proof of payment — please retain it for your records.' };
    storage.setItem(LS_SETTINGS, JSON.stringify(s));
  }
  if(/offline/i.test(s.receiptFooter||'')){
    s.receiptFooter = 'Thank you for your prompt payment. This receipt is proof of payment — please retain it for your records.';
    storage.setItem(LS_SETTINGS, JSON.stringify(s));
  }
  return s;
}
function saveSettings(s){ storage.setItem(LS_SETTINGS, JSON.stringify(s)); }

function loadAudit(){
  return JSON.parse(storage.getItem(LS_AUDIT) || '[]');
}
function logAudit(entry){
  const log = loadAudit();
  log.push(Object.assign({
    id: uid('log'),

/* ---------------------- Utilities ---------------------- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nextReceiptNumber(){
  let n = parseInt(storage.getItem(LS_RECEIPT_COUNTER) || '1000', 10);
  n = n + 1;
  storage.setItem(LS_RECEIPT_COUNTER, String(n));
  return 'AIJS-' + String(n).padStart(6,'0');
}
/* Assigns sequential receipt numbers to any payments that don't have one yet
   (covers payments created before this feature existed), oldest first, across all students. */
function backfillReceiptNumbers(students){
  const missing = [];
  students.forEach(s => (s.payments||[]).forEach(p => { if(!p.receiptNo) missing.push(p); }));
  if(missing.length === 0) return false;
  missing.sort((a,b)=> new Date(a.recordedAt) - new Date(b.recordedAt));
  missing.forEach(p => { p.receiptNo = nextReceiptNumber(); });
  return true;
}
function money(n){
  n = Number(n);
  if(isNaN(n)) n = 0;
  return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function todayIso(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function currentAcademicYear(){
  const y = new Date().getFullYear();
  return YEARS.includes(y) ? y : YEARS[0];
}
function termYearLabel(term, year){
  return (term && year) ? (year + ' – Term ' + term) : '—';
}
function sortTermsChron(list){
  return [...list].sort((a,b)=> (a.year - b.year) || (a.term - b.term));
}

function recalcStudent(s){
  const charges = s.termCharges || [];
  const payments = s.payments || [];
  const activeCharges = charges.filter(c=>!c.voided);
  const activePayments = payments.filter(p=>!p.voided);
  s.totalCharges = activeCharges.reduce((sum,c)=> sum + Number(c.amount), 0);
  s.totalOwed = Number(s.openingBalance || 0) + s.totalCharges;
  s.totalPaid = activePayments.reduce((sum,p)=> sum + Number(p.amount), 0);
  s.outstanding = s.totalOwed - s.totalPaid;
  const latest = sortTermsChron(activeCharges).slice(-1)[0];
  s.latestTerm = latest ? latest.term : null;
  s.latestYear = latest ? latest.year : null;
  return s;
}
function statusFor(s){
  if(s.outstanding <= 0) return {label: s.outstanding < 0 ? 'Credit' : 'Paid', cls: 'badge-paid'};
  if(s.totalPaid > 0) return {label:'Partial', cls:'badge-partial'};
  return {label:'Owing', cls:'badge-owing'};
}
function printStatusBadge(p){
  if(!p.printCount){
    return `<span class="badge badge-owing">Not Printed</span>`;
  }
  const when = new Date(p.lastPrintedAt).toLocaleDateString();
  const label = p.printCount > 1 ? `Printed ×${p.printCount}` : 'Printed';
  return `<span class="badge badge-paid" title="Last printed ${when} by ${escapeHtml(p.lastPrintedBy||'—')}">${label}</span>`;
}

function handleLogin(evt){
  evt.preventDefault();
  const username = document.getElementById('loginUsername').value.trim().toUpperCase();
  const password = document.getElementById('loginPassword').value;
  const users = loadUsers();
  const msgHost = document.getElementById('loginMsg');
  msgHost.innerHTML = '';

  if(!username || !password){
    msgHost.innerHTML = '<div class="msg-box msg-error">⚠ Please enter both username and password.</div>';
    return false;
  }

  const user = users[username];
  const lk = lockRemaining(username);
  if(lk){
    msgHost.innerHTML = '<div class="msg-box msg-error">⚠ Too many wrong attempts. Try again in ' + lk + ' minute(s).</div>';
    return false;
  }
  if(!user || !verifyPw(user, password)){
    const locked = registerFail(username);
    msgHost.innerHTML = '<div class="msg-box msg-error">⚠ ' + (locked ? 'Too many wrong attempts. Locked for 5 minutes.' : 'Invalid Username or Password.') + '</div>';
    return false;
  }
  clearFails(username);

  currentUser = { username, role: user.role, displayName: user.displayName || user.role };
  document.getElementById('loginPassword').value = '';
  enterApp();
  if(user.mustChange) openForceChangeModal();
  return false;
}

function promoNext(g){const i=GRADES.indexOf(g);return i<0?null:(i===GRADES.length-1?'DONE':GRADES[i+1]);}

function renderPromote(main){
  if(isReadOnly()){main.innerHTML=`<div class="view"><div class="page-head"><h1>Year-End Promotion</h1></div>${readOnlyBanner()}</div>`;return;}
  const st=loadSettings(),done=(st.promotions||[]).includes(promoYear);
  const studs=loadStudents().filter(s=>!s.isArchived);
  const rows=GRADES.map(g=>({g,n:studs.filter(s=>s.grade===g).length,to:promoNext(g)})).filter(r=>r.n);
  main.innerHTML=`<div class="view"><div class="page-head"><div><h1>Year-End Promotion</h1><p>Move every class up to the next grade for the new year. Nothing is deleted.</p></div></div>

  document.getElementById('modalHost').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:400px;"><div class="modal-head"><h3>Promote All Classes</h3><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p style="margin:0;">Move all pupils up one grade for ${promoYear}? Grade 7 pupils will go to the Archive. Their records are kept.</p></div><div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doPromote()">Yes, Promote</button></div></div></div>`;

function doPromote(){
  if(!requireBursar())return;
  const y=promoYear,st=loadSettings();st.promotions=st.promotions||[];
  if(st.promotions.includes(y)){toast('Already promoted into '+y+'.','error');return;}
  const list=loadStudents();let moved=0,fin=0;
  list.forEach(s=>{if(s.isArchived)return;const n=promoNext(s.grade);if(!n)return;
    (s.gradeHistory=s.gradeHistory||[]).push({year:y-1,grade:s.grade});
    if(n==='DONE'){s.isArchived=true;s.archivedAt=new Date().toISOString();s.archivedBy=currentUser.username;s.completedYear=y-1;fin++;}else{s.grade=n;moved++;}});
  saveStudents(list);st.promotions.push(y);saveSettings(st);
  try{logAudit({type:'edit',summary:`Year-end promotion into ${y}: ${moved} promoted, ${fin} finished school.`});}catch(e){}
  closeModal();toast(`Promotion done: ${moved} moved up, ${fin} archived.`,'success');renderPromote(resMain());

/* ---------------------- Fundraising ---------------------- */
const LS_FUND='aijs_fund_v1';
function loadFund(){try{const r=JSON.parse(storage.getItem(LS_FUND)||'null');if(r&&Array.isArray(r.events))return r;}catch(e){}return {events:[]};}
function saveFund(f){storage.setItem(LS_FUND,JSON.stringify(f));}
function fundSpent(ev){return (ev.uses||[]).filter(u=>u.status!=='Rejected').reduce((a,u)=>a+u.amount,0);}
function fundPill(st){const c=st==='Approved'?['#E3F2E9','#2F7B4F']:st==='Rejected'?['#FBE7E2','#B4432E']:['#FFF3D6','#8A6A12'];return `<span style="background:${c[0]};color:${c[1]};padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600">${st==='Pending'?'Waiting for approval':st}</span>`;}
function fundDate(d){try{return new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(e){return d;}}
function renderFundraising(main){
  const F=loadFund(),role=currentUser.role,isB=role==='Bursar',isH=role==='Headmaster';
  const raised=F.events.reduce((a,e)=>a+e.amount,0),spent=F.events.reduce((a,e)=>a+fundSpent(e),0);
  const pend=F.events.reduce((a,e)=>a+(e.uses||[]).filter(u=>u.status==='Pending').length,0);
  const today=new Date().toISOString().slice(0,10);
  const form=isB?`<div class="card" style="max-width:640px"><h2>Record Fundraising Income</h2><div class="grid2"><div class="field"><label>Date</label><input type="date" id="fiDate" value="${today}"></div><div class="field"><label>Event / Source</label><input id="fiSource" placeholder="e.g. Sports Day"></div></div><div class="grid2"><div class="field"><label>Amount Raised</label><input type="number" id="fiAmt" min="0" step="0.01"></div><div class="field"><label>Collected by</label><input id="fiBy" placeholder="Name"></div></div><div class="field"><label>Note (optional)</label><input id="fiNote"></div><button class="btn btn-primary" onclick="fundAddIncome()">Save Income</button></div>`:'';
  const cards=F.events.slice().reverse().map(e=>{const sp=fundSpent(e),bal=e.amount-sp;
    const uses=(e.uses||[]).map(u=>`<tr><td>${fundDate(u.date)}</td><td>${escapeHtml(u.purpose)}${u.remark?`<div class="helper-text">Headmaster: ${escapeHtml(u.remark)}</div>`:''}</td><td>${money(u.amount)}</td><td>${fundPill(u.status)}${u.decidedBy?`<div class="helper-text">${escapeHtml(u.decidedBy)} • ${fundDate(u.decidedAt)}</div>`:''}</td>${isH?`<td>${u.status==='Pending'?`<button class="btn btn-primary btn-sm" onclick="fundDecide('${e.id}','${u.id}','Approved')">Approve</button> <button class="btn btn-danger btn-sm" onclick="fundRejectAsk('${e.id}','${u.id}')">Reject</button>`:''}</td>`:''}</tr>`).join('');
    const add=isB&&bal>0?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div class="helper-text" style="margin-bottom:8px">Record what this money was used for:</div><div class="grid2"><div class="field"><label>Used for</label><input id="fuP_${e.id}" placeholder="e.g. Buy 20 footballs"></div><div class="field"><label>Amount</label><input type="number" id="fuA_${e.id}" min="0" step="0.01"></div></div><div class="field" style="max-width:220px"><label>Date</label><input type="date" id="fuD_${e.id}" value="${today}"></div><button class="btn btn-outline btn-sm" onclick="fundAddUse('${e.id}')">Add Spending</button></div>`:'';
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">${escapeHtml(e.source)}</h2><div class="helper-text">${fundDate(e.date)} • Collected by ${escapeHtml(e.collectedBy||'—')} • Recorded by ${escapeHtml(e.recordedBy)}${e.note?' • '+escapeHtml(e.note):''}</div></div><div style="text-align:right"><strong>${money(e.amount)}</strong><div class="helper-text">Spent ${money(sp)} • Left ${money(bal)}</div></div></div>${uses?`<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Date</th><th>Used for</th><th>Amount</th><th>Status</th>${isH?'<th></th>':''}</tr></thead><tbody>${uses}</tbody></table></div>`:'<p class="helper-text" style="margin-top:10px">No spending recorded yet.</p>'}${add}</div>`;}).join('');
  main.innerHTML=`<div class="view"><div class="page-head"><div><h1>Fundraising</h1><p>Money raised by the school and what it was used for</p></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px"><div class="stat"><div class="stat-label">Total Raised</div><div class="stat-value">${money(raised)}</div></div><div class="stat"><div class="stat-label">Total Spent</div><div class="stat-value">${money(spent)}</div></div><div class="stat"><div class="stat-label">Balance</div><div class="stat-value">${money(raised-spent)}</div></div><div class="stat"><div class="stat-label">Waiting for Approval</div><div class="stat-value">${pend}</div></div></div>${form}${cards||'<div class="card"><p class="helper-text">No fundraising recorded yet.</p></div>'}</div>`;
}

function fundDecide(eid,uid2,status){
  if(!currentUser||currentUser.role!=='Headmaster'){toast('Only the Headmaster can approve or reject.','error');return;}
  let remark='';
  if(status==='Rejected'){remark=(document.getElementById('fundRemark')||{value:''}).value.trim();if(!remark){toast('Please give a reason.','error');return;}}

function enterApp(){
  document.getElementById('loginScreen').classList.add('hidden');

function loadResults(){try{const r=JSON.parse(storage.getItem(LS_RESULTS)||'null');if(r&&r.term&&r.zim)return r;}catch(e){}return {term:{},zim:{}};}
function saveResults(r){storage.setItem(LS_RESULTS,JSON.stringify(r));}
function resSubjects(kind){const s=loadSettings();const l=kind==='zim'?s.zimSubjects:s.resultSubjects;return(Array.isArray(l)&&l.length)?l:(kind==='zim'?ZIM_DEF_SUBJ:RES_DEF_SUBJ);}

function resMean(arr){const v=arr.filter(x=>x!=null&&x!==''&&!isNaN(x)).map(Number);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function resFmt(v){return v==null?'—':(Math.round(v*10)/10).toString();}
function resChart(title,cats,series,max){
  const W=640,H=310,L=40,R=10,T=16,B=64,pw=W-L-R,ph=H-T-B;let g='';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E4DCC9"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5C6478">${Math.round(max*i/4*10)/10}</text>`;}
  const gw=pw/cats.length,bw=Math.min(46,gw*0.72/series.length);
  cats.forEach((c,ci)=>{const x0=L+gw*ci+(gw-bw*series.length)/2;
    series.forEach((s,si)=>{const v=s.values[ci];if(v==null)return;const h=ph*Math.min(v,max)/max,x=x0+bw*si,y=T+ph-h;
      g+=`<rect x="${x}" y="${y}" width="${bw-3}" height="${h}" rx="3" fill="${s.color}"/><text x="${x+(bw-3)/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="600" fill="#22283A">${resFmt(v)}</text>`;});
    g+=`<text x="${L+gw*ci+gw/2}" y="${T+ph+18}" text-anchor="middle" font-size="12" fill="#22283A">${escapeHtml(c.length>14?c.slice(0,13)+'…':c)}</text>`;});
  let lg='';if(series.length>1)series.forEach((s,i)=>{lg+=`<rect x="${L+i*100}" y="${H-20}" width="11" height="11" rx="2" fill="${s.color}"/><text x="${L+i*100+16}" y="${H-10}" font-size="12" fill="#22283A">${escapeHtml(s.name)}</text>`;});
  return `<div style="margin-bottom:18px"><h3 style="font-family:var(--serif);color:var(--navy);margin:0 0 8px;font-size:16px">${escapeHtml(title)}</h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${escapeHtml(title)}" style="display:block;background:#fff;border:1px solid var(--line);border-radius:8px;font-family:Georgia,serif">${g}${lg}<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="#1F6B4A"/></svg></div>`;
}

function isReadOnly(){ return currentUser.role !== 'Bursar'; }

function readOnlyBanner(){
  if(!isReadOnly()) return '';
  return `<div class="readonly-banner">👁 You are signed in as Director. This is a read-only view — records cannot be edited, added, or deleted from this account.</div>`;

function backupReminderBanner(){
  if(isReadOnly()) return ''; // only the Bursar can export, so only nudge the Bursar
  const settings = loadSettings();
  const last = settings.lastBackupExportAt;
  const studentCount = loadStudents().filter(s=>!s.isArchived).length;
  if(studentCount === 0) return ''; // nothing worth backing up yet
  if(!last){
    return `<div class="readonly-banner">💾 You haven't exported a backup yet. Go to Settings → Backup &amp; Restore to save a copy of your data.</div>`;
  }
  const daysSince = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
  if(daysSince >= 7){
    return `<div class="readonly-banner">💾 It's been ${daysSince} days since your last backup. Consider exporting a fresh one from Settings.</div>`;
  }
  return '';
}

function renderOutstandingTable(students){
  const owing = students.filter(s => s.outstanding > 0).sort((a,b)=> b.outstanding - a.outstanding);

function handleAddStudent(evt){
  if(!requireBursar(typeof evt!=='undefined'?evt:null)) return false;
  evt.preventDefault();
  const msgHost = document.getElementById('addStudentMsg');
  msgHost.innerHTML = '';

  const name = document.getElementById('asName').value.trim();
  const grade = document.getElementById('asGrade').value;
  const openingBalance = document.getElementById('asOpeningBalance').value;
  const year = document.getElementById('asYear').value;
  const term = document.getElementById('asTerm').value;
  const currentFees = document.getElementById('asCurrentFees').value;
  const phone = document.getElementById('asPhone').value.trim();
  const address = document.getElementById('asAddress').value.trim();

  const errors = [];
  if(!name) errors.push('Student Name is required.');
  if(!grade) errors.push('Please select a Grade.');
  if(openingBalance === '' || isNaN(openingBalance) || Number(openingBalance) < 0) errors.push('Opening Balance must be a valid non-negative number.');
  if(!year) errors.push('Please select an Academic Year.');
  if(!term) errors.push('Please select a Term.');
  if(currentFees === '' || isNaN(currentFees) || Number(currentFees) < 0) errors.push('Fees for this term must be a valid non-negative number.');

  if(errors.length){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ ${errors.join(' ')}</div>`;
    return false;
  }

  const students = loadStudents();
  const duplicate = students.find(s => !s.isArchived && s.name.trim().toLowerCase() === name.toLowerCase() && s.grade === grade);
  if(duplicate){
    msgHost.innerHTML = `<div class="msg-box msg-warn">⚠ A student named "${escapeHtml(name)}" already exists in ${escapeHtml(grade)}. Please check View Records before adding a duplicate — if this is intentional (e.g. same name, different child), you may proceed by clicking Save Student again.</div>`;
    if(!evt.target.dataset.confirmedDup){
      evt.target.dataset.confirmedDup = '1';
      return false;
    }
  }
  delete evt.target.dataset.confirmedDup;

  const newStudent = recalcStudent({
    id: uid('stu'),
    name, grade,
    openingBalance: Number(openingBalance),
    termCharges: [{
      id: uid('chg'),
      year: Number(year),
      term: Number(term),
      amount: Number(currentFees),
      addedAt: new Date().toISOString(),
      addedBy: currentUser.username,
      note: 'Initial term charge at student setup'
    }],
    payments: [],
    phone, address,
    isArchived: false,
    createdAt: new Date().toISOString(),
    createdBy: currentUser.username
  });
  students.push(newStudent);
  saveStudents(students);
  logAudit({ type:'add', studentId:newStudent.id, studentName:name, summary:`Student added — ${termYearLabel(Number(term),Number(year))}, opening balance ${money(openingBalance)}, term fees ${money(currentFees)}` });

  toast(`${name} was added successfully.`, 'success');
  speakBursarEvent('Student added successfully.');
  document.getElementById('addStudentForm').reset();
  document.getElementById('asOpeningBalance').value = '0';
  msgHost.innerHTML = `<div class="msg-box msg-success">✓ Student "${escapeHtml(name)}" saved successfully. Total Owed: ${money(newStudent.totalOwed)}.</div>`;
  return false;
}

function handleRecordPayment(evt){
  if(!requireBursar(typeof evt!=='undefined'?evt:null)) return false;
  evt.preventDefault();
  const msgHost = document.getElementById('paymentMsg');
  msgHost.innerHTML = '';

  const studentId = document.getElementById('rpStudent').value;
  const year = document.getElementById('rpYear').value;
  const term = document.getElementById('rpTerm').value;
  const amount = document.getElementById('rpAmount').value;
  const date = document.getElementById('rpDate').value;

  const errors = [];
  if(!studentId) errors.push('Please select a student.');
  if(!year) errors.push('Please select an Academic Year.');
  if(!term) errors.push('Please select a Term.');
  if(amount === '' || isNaN(amount) || Number(amount) <= 0) errors.push('Amount Paid must be a positive number.');
  if(!date) errors.push('Please select a payment date.');

  if(errors.length){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ ${errors.join(' ')}</div>`;
    return false;
  }

  const students = loadStudents();
  const student = students.find(s => s.id === studentId);
  if(!student){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ Student record not found.</div>`;
    return false;
  }

  const payment = {
    id: uid('pay'),
    receiptNo: nextReceiptNumber(),
    amount: Number(amount),
    date: date,
    year: Number(year),
    term: Number(term),
    recordedAt: new Date().toISOString(),
    recordedBy: currentUser.username
  };
  student.payments = student.payments || [];
  student.payments.push(payment);
  recalcStudent(student);
  payment.balanceAfter = student.outstanding;
  saveStudents(students);
  logAudit({ type:'payment', studentId:student.id, studentName:student.name, summary:`Payment of ${money(payment.amount)} recorded for ${termYearLabel(payment.term,payment.year)} — balance after: ${money(payment.balanceAfter)}` });

  toast(`Payment of ${money(payment.amount)} saved for ${student.name}.`, 'success');
  speakBursarEvent('Payment recorded successfully.');
  msgHost.innerHTML = `<div class="msg-box msg-success">✓ Payment Saved Successfully. New Outstanding Balance: ${money(student.outstanding)}.</div>`;
  document.getElementById('paymentForm').reset();
  document.getElementById('rpDate').value = todayIso();
  document.getElementById('rpYear').value = currentAcademicYear();
  document.getElementById('paymentPreview').innerHTML = '';
}

  const e = entries.find(x=>x.id===entryId);
  if(!e) return;

function handleVoidVacation(entryId){
  if(!requireBursar(typeof evt!=='undefined'?evt:null)) return false;
  const reason = document.getElementById('voidVacationReason').value.trim();
  const msgHost = document.getElementById('voidVacationMsg');
  if(!reason){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ Please enter a reason for voiding this payment.</div>`;
    return;
  }
  const entries = loadVacationPayments();
  const e = entries.find(x=>x.id===entryId);
  if(!e) return;

  e.voided = true;
  e.voidedAt = new Date().toISOString();
  e.voidedBy = currentUser.username;
  e.voidReason = reason;
  saveVacationPayments(entries);
  logAudit({ type:'vacation-void', studentId:'', studentName:e.studentName, summary:`Grade 7 vacation payment voided — ${money(e.amount)} (Receipt ${e.receiptNo||e.id}) — reason: ${reason}` });

  toast(`Vacation payment voided for ${e.studentName}.`, 'success');
  closeModal();
  if(activeTab === 'vacation') navigateTo('vacation');
}

function handlePaymentsFilter(){
  paymentsSearchTerm = document.getElementById('payRepSearch').value;
  paymentsYearFilter = document.getElementById('payRepYearFilter').value;
  paymentsTermFilter = document.getElementById('payRepTermFilter').value;
  paymentsPrintFilter = document.getElementById('payRepPrintFilter').value;
  renderPaymentsTable();
}

function getAllPaymentsFlat(){
  const students = loadStudents();
  const rows = [];
  students.forEach(s => {
    (s.payments||[]).forEach(p => {
      rows.push({ payment:p, student:s });
    });
  });
  rows.sort((a,b)=> new Date(b.payment.recordedAt) - new Date(a.payment.recordedAt));
  return rows;
}

function renderPaymentsTable(){
  const host = document.getElementById('paymentsReportHost');
  let rows = getAllPaymentsFlat();
  const totalCount = rows.length;

  if(paymentsSearchTerm.trim()){
    const q = paymentsSearchTerm.trim().toLowerCase();
    rows = rows.filter(r => r.student.name.toLowerCase().includes(q));
  }
  if(paymentsYearFilter){
    rows = rows.filter(r => String(r.payment.year) === paymentsYearFilter);
  }
  if(paymentsTermFilter){
    rows = rows.filter(r => String(r.payment.term) === paymentsTermFilter);
  }
  if(paymentsPrintFilter === 'printed'){
    rows = rows.filter(r => r.payment.printCount);
  }else if(paymentsPrintFilter === 'notprinted'){
    rows = rows.filter(r => !r.payment.printCount);
  }

  if(totalCount === 0){
    host.innerHTML = emptyState('No Payments Recorded', 'No records available at this time.');
    return;
  }
  if(rows.length === 0){
    host.innerHTML = emptyState('No Matches', 'No payments match your search or filter.');
    return;
  }

  const printedCount = getAllPaymentsFlat().filter(r=>r.payment.printCount).length;
  host.innerHTML = `
    <div class="helper-text" style="margin-bottom:12px;">${printedCount} of ${totalCount} payments have a printed receipt on record.</div>
    <table>
      <thead>
        <tr>
          <th>Receipt No.</th><th>Date</th><th>Student</th><th>Grade</th><th>For Term</th>
          <th class="num">Amount</th><th>Recorded By</th><th>Receipt Status</th><th>Receipt</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          const p = r.payment, s = r.student;
          return `<tr>
            <td>${escapeHtml(p.receiptNo||'—')}</td>
            <td>${escapeHtml(p.date)}</td>
            <td>${escapeHtml(s.name)}${s.isArchived ? ' <span class="badge badge-archived" style="margin-left:4px;">Archived</span>' : ''}</td>
            <td>${escapeHtml(s.grade)}</td>
            <td>${termYearLabel(p.term,p.year)}</td>
            <td class="num">${money(p.amount)}</td>
            <td>${escapeHtml(p.recordedBy||'—')}</td>
            <td>${printStatusBadge(p)}</td>
            <td><button class="btn btn-outline btn-sm" onclick="printReceipt('${s.id}','${p.id}')">🖨 ${p.printCount ? 'Reprint' : 'Print'}</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function handleAddTermCharge(evt, studentId){
  if(!requireBursar(typeof evt!=='undefined'?evt:null)) return false;
  evt.preventDefault();
  const msgHost = document.getElementById('addChargeMsg');
  const year = document.getElementById('tcYear').value;
  const term = document.getElementById('tcTerm').value;
  const amount = document.getElementById('tcAmount').value;

  const errors = [];
  if(!year) errors.push('Please select an Academic Year.');
  if(!term) errors.push('Please select a Term.');
  if(amount === '' || isNaN(amount) || Number(amount) <= 0) errors.push('Amount must be a positive number.');

  if(errors.length){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ ${errors.join(' ')}</div>`;
    return false;
  }

  const students = loadStudents();
  const s = students.find(x=>x.id===studentId);
  if(!s) return false;

  const existing = (s.termCharges||[]).find(c=> c.year===Number(year) && c.term===Number(term));
  if(existing){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ ${termYearLabel(Number(term),Number(year))} has already been charged (${money(existing.amount)}). Edit isn't available for individual charges to preserve the ledger history — contact support if a correction is needed.</div>`;
    return false;
  }

  const charge = {
    id: uid('chg'),
    year: Number(year),
    term: Number(term),
    amount: Number(amount),
    addedAt: new Date().toISOString(),
    addedBy: currentUser.username,
    note: ''
  };
  s.termCharges = s.termCharges || [];
  s.termCharges.push(charge);
  recalcStudent(s);
  saveStudents(students);
  logAudit({ type:'charge', studentId:s.id, studentName:s.name, summary:`New term charge added — ${termYearLabel(charge.term,charge.year)}: ${money(charge.amount)}` });

  toast(`${termYearLabel(charge.term,charge.year)} fees added for ${s.name}.`, 'success');
  closeModal();
  openStudentModal(studentId);
  if(activeTab === 'records') renderRecordsTable();
}

function handleEditStudent(evt, studentId){
  if(!requireBursar(typeof evt!=='undefined'?evt:null)) return false;
  evt.preventDefault();
  const msgHost = document.getElementById('editStudentMsg');
  msgHost.innerHTML = '';

  const name = document.getElementById('esName').value.trim();
  const grade = document.getElementById('esGrade').value;
  const openingBalance = document.getElementById('esOpeningBalance').value;
  const phone = document.getElementById('esPhone').value.trim();
  const address = document.getElementById('esAddress').value.trim();

  const errors = [];
  if(!name) errors.push('Student Name is required.');
  if(!grade) errors.push('Please select a Grade.');
  if(openingBalance === '' || isNaN(openingBalance) || Number(openingBalance) < 0) errors.push('Opening Balance must be a valid non-negative number.');

  if(errors.length){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ ${errors.join(' ')}</div>`;
    return false;
  }

  const students = loadStudents();
  const s = students.find(x=>x.id===studentId);
  if(!s){ closeModal(); return false; }

  const before = { name:s.name, grade:s.grade, openingBalance:s.openingBalance, phone:s.phone||'', address:s.address||'' };
  const after = { name, grade, openingBalance:Number(openingBalance), phone, address };

  const changedFields = Object.keys(after).filter(k => String(before[k]) !== String(after[k]));

  s.name = name;
  s.grade = grade;
  s.openingBalance = Number(openingBalance);
  s.phone = phone;
  s.address = address;
  recalcStudent(s);
  saveStudents(students);

  if(changedFields.length){
    const diffSummary = changedFields.map(k => `${k}: "${before[k]}" → "${after[k]}"`).join('; ');
    logAudit({ type:'edit', studentId:s.id, studentName:name, summary:`Student record edited — ${diffSummary}`, before, after });
  }

  toast(`${name}'s record was updated successfully.`, 'success');
  closeModal();
  if(activeTab === 'records') renderRecordsTable();
  if(activeTab === 'dashboard') navigateTo('dashboard');
  return false;
}

function handleChangePassword(evt){
  evt.preventDefault();
  const msgHost = document.getElementById('pwMsg');
  msgHost.innerHTML = '';

  const cur = document.getElementById('pwCurrent').value;
  const next = document.getElementById('pwNew').value;
  const confirm = document.getElementById('pwConfirm').value;

  const users = loadUsers();
  const user = users[currentUser.username];

  if(!verifyPw(user, cur)){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ Current password is incorrect.</div>`;
    return false;
  }
  if(!next || next.length < 6 || next === '1234'){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ New password must be at least 6 characters (not 1234).</div>`;
    return false;
  }
  if(next !== confirm){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ New password and confirmation do not match.</div>`;
    return false;
  }

  setPw(user, next); user.mustChange = false;
  saveUsers(users);
  toast('Password changed successfully.', 'success');
  msgHost.innerHTML = `<div class="msg-box msg-success">✓ Password changed successfully.</div>`;
  document.getElementById('pwForm').reset();
  return false;
}

function backupPayload(){
  return {
    students: loadStudents(), settings: loadSettings(), audit: loadAudit(), vacation: loadVacationPayments(), results: loadResults(), fundraising: loadFund(),
    receiptCounter: parseInt(storage.getItem(LS_RECEIPT_COUNTER) || '1000', 10),
    vacationReceiptCounter: parseInt(storage.getItem(LS_VACATION_RECEIPT_COUNTER) || '1000', 10),
    exportedAt: new Date().toISOString()
  };
}
function exportBackup(prefix){
  const custom = (typeof prefix === 'string');
  const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (custom ? prefix : 'AIJS-fees-backup') + '-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  if(!custom){
    const s = loadSettings(); s.lastBackupExportAt = new Date().toISOString(); saveSettings(s);
    toast('Backup downloaded.', 'success');
  }
}
let pendingImport = null;
function importBackup(evt){
  if(!requireBursar(evt)) return;
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const d = JSON.parse(e.target.result);
      if(!d || !Array.isArray(d.students) || !d.students.every(s => s && typeof s.id === 'string' && typeof s.name === 'string')) throw new Error('bad');
      pendingImport = d;
      document.getElementById('modalHost').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal" style="max-width:440px;">
            <div class="modal-head"><h3>Restore Backup?</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <div class="modal-body">
              <p style="margin:0 0 8px;">This backup has <strong>${d.students.length} student(s)</strong>${d.exportedAt ? ' and was saved on ' + escapeHtml(String(d.exportedAt).slice(0,10)) : ''}.</p>
              <p class="helper-text">It will <strong>replace</strong> the data on this device. A safety copy of the current data downloads first.</p>
            </div>
            <div class="modal-foot">
              <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
              <button class="btn btn-danger" onclick="confirmRestore()">Restore</button>
            </div>
          </div>
        </div>`;
    }catch(err){
      toast('That file is not a valid fees backup.', 'error');
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function confirmRestore(){
  if(!requireBursar() || !pendingImport) return;
  const d = pendingImport; pendingImport = null;
  exportBackup('AIJS-safety-before-restore');
  saveStudents(d.students.map(migrateStudent));
  if(d.settings) saveSettings(d.settings);
  const cur = loadAudit();
  if(Array.isArray(d.audit)){
    const ids = new Set(cur.map(x => x.id));
    d.audit.forEach(x => { if(x && !ids.has(x.id)) cur.push(x); });
    cur.sort((a,b) => String(a.at).localeCompare(String(b.at)));
    storage.setItem(LS_AUDIT, JSON.stringify(cur));
  }
  const vac = Array.isArray(d.vacation) ? d.vacation : [];
  saveVacationPayments(vac);
  if(d.results&&d.results.term&&d.results.zim) saveResults(d.results);
  if(d.fundraising&&Array.isArray(d.fundraising.events)) saveFund(d.fundraising);
  const num = r => { const m = /(\d+)\s*$/.exec(String((r && r.receiptNo) || '')); return m ? parseInt(m[1],10) : 0; };
  const maxPay = Math.max(0, ...d.students.flatMap(s => (s.payments || []).map(num)));
  const maxVac = Math.max(0, ...vac.map(num));
  const c1 = parseInt(storage.getItem(LS_RECEIPT_COUNTER) || '1000', 10);
  const c2 = parseInt(storage.getItem(LS_VACATION_RECEIPT_COUNTER) || '1000', 10);
  storage.setItem(LS_RECEIPT_COUNTER, String(Math.max(c1, d.receiptCounter || 0, maxPay)));
  storage.setItem(LS_VACATION_RECEIPT_COUNTER, String(Math.max(c2, d.vacationReceiptCounter || 0, maxVac)));
  logAudit({ type:'edit', studentId:'', studentName:'ALL', summary:'Backup restored (' + d.students.length + ' students)' });
  closeModal(); toast('Backup restored.', 'success'); navigateTo(activeTab);
}

  const msgHost = document.getElementById('clearAllMsg');
  if(typed !== 'DELETE'){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ Please type DELETE exactly (all capitals) to confirm.</div>`;
    return;
  }
  if(!verifyPw(loadUsers()[currentUser.username], document.getElementById('clearAllPw').value)){
    msgHost.innerHTML = `<div class="msg-box msg-error">⚠ Wrong password.</div>`;
    return;
  }
  exportBackup('AIJS-before-clear');
  logAudit({ type:'edit', studentId:'', studentName:'ALL', summary:'All student data cleared (safety backup downloaded first)' });
  storage.removeItem(LS_STUDENTS);
  storage.removeItem(LS_VACATION);
  closeModal();
  toast('All student data has been cleared.', 'success');
  navigateTo(activeTab);
}

/* ---------------------- Global Error Handler ----------------------
   On a phone (especially inside an APK wrapper) there is no console to check,
   so any unexpected error is shown as an on-screen banner instead of failing
   silently. This is what makes buttons look "dead" when something breaks. */
window.addEventListener('error', function(e){
  showFatalErrorBanner(e.message || 'An unexpected error occurred.');
});
function showFatalErrorBanner(message){
  if(document.getElementById('fatalErrorBanner')) return; // don't stack multiple
  const el = document.createElement('div');
  el.id = 'fatalErrorBanner';
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#B4432E;color:#fff;padding:10px 16px;font-size:12.5px;font-family:sans-serif;text-align:center;';
  el.textContent = '⚠ App error: ' + message + ' — please screenshot this and report it.';
  document.body.appendChild(el);
}

/* ---------------------- Voice settings, intro & cheer ---------------------- */
const LS_VOICE='aijs_voice';
/* Optional: paste a real recorded cheer as a data URL here (e.g. 'data:audio/mpeg;base64,...') to replace the built-in crowd sound. */
const CHEER_AUDIO_DATA='';
function getVoiceSettings(){let v={};try{v=JSON.parse(storage.getItem(LS_VOICE)||'{}');}catch(e){}return Object.assign({enabled:true,intro:true,volume:1,voice:''},v);}
function applyVoice(u){const v=getVoiceSettings();u.volume=v.volume;if(v.voice){const f=(speechSynthesis.getVoices()||[]).find(x=>x.name===v.voice);if(f)u.voice=f;}}
function speak(message){
  try{
    const v=getVoiceSettings();
    if(!v.enabled||!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(message);
    utter.rate=0.95;utter.pitch=1;applyVoice(utter);
    window.speechSynthesis.speak(utter);
  }catch(err){}
}
function voiceCardHtml(){
  const v=getVoiceSettings();
  return `<div class="card" style="max-width:520px;">
    <h2>Voice</h2>
    <label style="display:block;margin-bottom:10px;"><input type="checkbox" id="vsEnabled" ${v.enabled?'checked':''} onchange="handleVoiceChange()"> Voice-over on</label>
    <label style="display:none;"><input type="checkbox" id="vsIntro" ${v.intro?'checked':''} onchange="handleVoiceChange()"> Play welcome message when the app opens</label>
    <div class="field"><label>Volume</label><input type="range" id="vsVolume" min="0.1" max="1" step="0.1" value="${v.volume}" onchange="handleVoiceChange()"></div>
    <div class="field"><label>Voice</label><select id="vsVoice" onchange="handleVoiceChange()"></select></div>
    <button class="btn btn-outline" onclick="speak('Angels Infant and Junior School. Voice test.')">▶ Test voice</button>
  </div>`;
}
function populateVoiceSelect(){
  const sel=document.getElementById('vsVoice');
  if(!sel||!('speechSynthesis' in window)) return;
  const v=getVoiceSettings();
  sel.innerHTML='<option value="">Default voice</option>'+speechSynthesis.getVoices().map(x=>`<option value="${escapeHtml(x.name)}"${x.name===v.voice?' selected':''}>${escapeHtml(x.name)} (${escapeHtml(x.lang)})</option>`).join('');
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=populateVoiceSelect;
function handleVoiceChange(){
  storage.setItem(LS_VOICE,JSON.stringify({
    enabled:document.getElementById('vsEnabled').checked,
    intro:document.getElementById('vsIntro').checked,
    volume:Number(document.getElementById('vsVolume').value),
    voice:document.getElementById('vsVoice').value}));
}
let introStarted=false;
function playIntro(){
  return; /* opening voice-over removed */
  if(introStarted) return;
  const v=getVoiceSettings();
  if(!v.enabled||!v.intro||!('speechSynthesis' in window)){introStarted=true;return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('Angels, the best school, offering the best education!');
    u.rate=0.9;u.pitch=1.05;applyVoice(u);
    u.onstart=function(){introStarted=true;};
    u.onend=playCheer;
    speechSynthesis.speak(u);
  }catch(e){}
}
function playCheer(){
  const v=getVoiceSettings();
  if(!v.enabled) return;
  if(CHEER_AUDIO_DATA){try{const a=new Audio(CHEER_AUDIO_DATA);a.volume=v.volume;a.play();}catch(e){}return;}
  try{
    const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),dur=3;
    const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=0.7;
    const g=ctx.createGain(),t=ctx.currentTime,p=0.5*v.volume;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p,t+0.4);g.gain.setValueAtTime(p,t+1.6);g.gain.linearRampToValueAtTime(0,t+dur);
    src.connect(bp);bp.connect(g);g.connect(ctx.destination);src.start();
  }catch(e){}
  ['Yes!','Yes!','Yesssss!'].forEach(function(w){try{const u=new SpeechSynthesisUtterance(w);u.pitch=1.9;u.rate=1.25;applyVoice(u);speechSynthesis.speak(u);}catch(e){}});
}

/* ---------------------- Auto-logout ---------------------- */
let idleTimer=null,hiddenAt=0;
function autoLogout(){if(currentUser){handleLogout();toast('Logged out for security.','info');}}
function resetIdle(){clearTimeout(idleTimer);if(currentUser)idleTimer=setTimeout(autoLogout,300000);}
['click','keydown','touchstart','mousemove'].forEach(function(ev){document.addEventListener(ev,resetIdle,{passive:true});});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();}
  else if(currentUser&&hiddenAt&&Date.now()-hiddenAt>60000){autoLogout();}
});

/* ---------------------- Init ---------------------- */
try{
  loadUsers();
  loadSettings();
  selectLoginRole('ADMIN');
}catch(e){
  showFatalErrorBanner('Could not start up (' + e.message + ').');
}

if(usingFallbackStorage){
  const warn = document.createElement('div');
  warn.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#9C6B12;color:#fff;padding:8px 14px;font-size:11.5px;font-family:sans-serif;text-align:center;';
  warn.textContent = '⚠ This app cannot save data on this device — enable "Local Storage" / "DOM Storage" in your app wrapper\'s settings, or open this file in a regular browser instead.';
  document.body.appendChild(warn);
}

setTimeout(playIntro, 400);
['pointerdown','keydown'].forEach(function(ev){ document.addEventListener(ev, function(){ playIntro(); }, { once:true }); });
setTimeout(function(){ dismissSplashScreen(); }, 10000);
function dismissSplashScreen(){
  const splash = document.getElementById('splashScreen');
  if(!splash) return;
  splash.style.opacity = '0';
  setTimeout(()=> splash.remove(), 650);
}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBju5e3N9SvyndhsuHnDU7d7Wr3lO_6tFs",authDomain:"angels-infant-final-app.firebaseapp.com",projectId:"angels-infant-final-app",storageBucket:"angels-infant-final-app.firebasestorage.app",messagingSenderId:"282412012601",appId:"1:282412012601:web:1e69efd1a350e8c4e469e8"});
const auth=getAuth(app),db=getFirestore(app);
const KEYS=[LS_STUDENTS,LS_SETTINGS,LS_AUDIT,LS_RECEIPT_COUNTER,LS_VACATION,LS_VACATION_RECEIPT_COUNTER,LS_FUND,LS_RESULTS];
const CH=300000;
let online=false,canWrite=false,applying=false,synced=false,unsub=null,timers={},last={};
const rawSet=storage.setItem.bind(storage);
function push(k){
  const v=storage.getItem(k)||'';
  if(last[k]===v) return Promise.resolve();
  const n=Math.max(1,Math.ceil(v.length/CH));
  return Promise.all(Array.from({length:n},(_,i)=>setDoc(doc(db,'school',k+'~'+i),{c:v.slice(i*CH,(i+1)*CH)})))
    .then(()=>setDoc(doc(db,'school',k),{n,t:Date.now()}))
    .then(()=>{last[k]=v;})
    .catch(e=>toast('Could not save online: '+(e.code||e.message),'error'));
}
storage.setItem=function(k,v){
  rawSet(k,v);
  if(online&&canWrite&&!applying&&KEYS.includes(k)){clearTimeout(timers[k]);timers[k]=setTimeout(()=>{delete timers[k];push(k);},700);}
};
function onSnap(snap){
  const d={};snap.forEach(x=>{d[x.id]=x.data();});
  let changed=false;applying=true;
  KEYS.forEach(k=>{
    const m=d[k];if(!m)return;
    let s='',ok=true;
    for(let i=0;i<m.n;i++){const c=d[k+'~'+i];if(!c){ok=false;break;}s+=c.c;}
    if(ok&&storage.getItem(k)!==s){rawSet(k,s);last[k]=s;changed=true;}
  });
  applying=false;
  if(!synced){
    synced=true;
    if(canWrite&&!d[LS_STUDENTS]) KEYS.forEach(k=>{if(storage.getItem(k)!=null)push(k);});
  }else if(changed&&!canWrite){ try{navigateTo(activeTab);}catch(e){} }
}
const box=(t,c)=>'<div class="msg-box '+(c||'msg-error')+'">'+t+'</div>';
window.selectLoginRole=function(){};
window.handleLogin=function(evt){
  evt.preventDefault();
  const email=document.getElementById('loginUsername').value.trim().toLowerCase();
  const pw=document.getElementById('loginPassword').value;
  const msg=document.getElementById('loginMsg');
  if(!email||!pw){msg.innerHTML=box('⚠ Please enter your email and password.');return false;}
  msg.innerHTML=box('Signing in…','msg-info');
  signInWithEmailAndPassword(auth,email,pw).then(async()=>{
    const r=await getDoc(doc(db,'users',email));
    const role=r.exists()?r.data().role:null;
    if(role!=='bursar'&&role!=='principal'){await signOut(auth);throw {code:'no-role'};}
    canWrite=role==='bursar';online=true;synced=false;
    await new Promise(res=>{
      let done=false;
      unsub=onSnapshot(collection(db,'school'),s=>{onSnap(s);if(!done){done=true;res();}},e=>{toast('Online sync problem: '+e.code,'error');if(!done){done=true;res();}});
    });
    currentUser=canWrite?{username:'ADMIN',role:'Bursar',displayName:'Bursar'}:{username:'PRINCIPAL',role:'Director',displayName:'Principal'};
    document.getElementById('loginPassword').value='';msg.innerHTML='';
    enterApp();
  }).catch(e=>{
    const c=e&&e.code;
    msg.innerHTML=box(c==='no-role'?'⚠ This account has not been given access.':(c==='auth/too-many-requests'?'⚠ Too many attempts. Try again later.':(c==='auth/network-request-failed'?'⚠ No internet connection.':'⚠ Invalid email or password.')));
  });
  return false;
};
window.openForgotPasswordModal=function(){
  const e=document.getElementById('loginUsername').value.trim();
  if(!e){toast('Type your email in the box first.','error');return;}
  sendPasswordResetEmail(auth,e).catch(()=>{}).finally(()=>toast('If that email has an account, a reset link has been sent.','success'));
};
const baseLogout=window.handleLogout;
window.handleLogout=function(){
  try{unsub&&unsub();}catch(e){}
  const ks=Object.keys(timers);ks.forEach(k=>clearTimeout(timers[k]));timers={};
  const wasWriter=canWrite;
  online=false;
  Promise.all(wasWriter?ks.map(push):[]).finally(()=>signOut(auth));
  if(!wasWriter) KEYS.forEach(k=>storage.removeItem(k));
  canWrite=false;synced=false;
  baseLogout();
  document.getElementById('loginUsername').value='';
};
</script>
